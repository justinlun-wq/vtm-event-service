" y="130.4" width="85.0" height="85.0" rx="3" fill="#e8f5f6" stroke="#087d89" stroke-dasharray="5 4"/><text x="494.3" y="162.2" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1b2b4b">體驗站 4</text><text x="494.3" y="183.5" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1b2b4b">2 × 2 m</text><rect x="546.2" y="130.4" width="85.0" height="85.0" rx="3" fill="#e8f5f6" stroke="#087d89" stroke-dasharray="5 4"/><text x="588.7" y="162.2" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1b2b4b">體驗站 5</text><text x="588.7" y="183.5" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1b2b4b">2 × 2 m</text><rect x="157.8" y="228.1" width="484.5" height="163.6" rx="3" fill="#f3f5f7" stroke="#d8e1e7"/><text x="400.0" y="309.9" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1b2b4b">講解／小組討論</text><rect x="157.8" y="402.4" width="484.5" height="17.0" rx="3" fill="#f3f5f7" stroke="#d8e1e7"/><text x="400.0" y="410.9" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1b2b4b">通道／輪候與觀察</text><text x="655.0" y="452.0" text-anchor="end" font-size="12" fill="#087d89">入口／出口 ↗</text><text x="400.0" y="78.0" text-anchor="middle" font-size="13" fill="#536271">← 12 m →</text><text x="129.0" y="260.0" text-anchor="middle" transform="rotate(-90 129.0 260.0)" font-size="13" fill="#536271">← 8 m →</text><text x="400" y="487" text-anchor="middle" font-size="12" fill="#536271">配置概念圖，非施工圖；實際設備、動線與人數按場地確認。</text></g></svg>