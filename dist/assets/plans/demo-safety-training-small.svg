<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-label="安全情境培訓小型配置示例，6 乘 4 米"><rect width="800" height="530" fill="#fff"/><g font-family="Arial,PingFang TC,Microsoft JhengHei,sans-serif"><text x="400" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2b4b">安全情境培訓 · 小型配置示例</text><text x="400" y="53" text-anchor="middle" font-size="14" fill="#536271">6 × 4 m · 24 m² · 1 個體驗站</text><rect x="145.0" y="90.0" width="510.0" height="340.0" rx="3" fill="#fff" stroke="#1b2b4b"/><rect x="166.2" y="102.8" width="229.5" height="46.8" rx="3" fill="#1b2b4b" stroke="#1b2b4b"/><text x="281.0" y="126.1" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#fff">屏幕／講解</text><rect x="463.8" y="102.8" width="170.0" height="46.8" rx="3" fill="#f3f5f7" stroke="#8ba3b3"/><text x="548.8" y="126.1" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1b2b4b">控制枱</text><rect x="315.0" y="170.8" width="170.0" height="170.0" rx="3" fill="#e8f5f6" stroke="#087d89" stroke-dasharray="5 4"/><text x="400.0" y="234.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1b2b4b">體驗站 1</text><text x="400.0" y="277.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1b2b4b">2 × 2 m</text><rect x="170.5" y="374.8" width="459.0" height="34.0" rx="3" fill="#f3f5f7" stroke="#d8e1e7"/><text x="400.0" y="391.8" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1b2b4b">通道／輪候與觀察</text><text x="655.0" y="452.0" text-anchor="end" font-size="12" fill="#087d89">入口／出口 ↗</text><text x="400.0" y="78.0" text-anchor="middle" font-size="13" fill="#536271">← 6 m →</text><text x="129.0" y="260.0" text-anchor="middle" transform="rotate(-90 129.0 260.0)" font-size="13" fill="#536271">← 4 m →</text><text x="400" y="487" text-anchor="middle" font-size="12" fill="#536271">配置概念圖，非施工圖；實際設備、動線與人數按場地確認。</text></g></svg>